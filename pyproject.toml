[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssvep-demo"
version = "0.1.0"
description = "Shared configuration and data protocol for the SSVEP demo"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
stimulus = ["psychopy>=2023.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
